name: .NET 8 CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: |
        dotnet restore backend/Estoque.API/Estoque.API.csproj
        dotnet restore backend/Faturamento.API/Faturamento.API.csproj
        dotnet restore backend/Estoque.API.Tests/Estoque.API.Tests.csproj
        dotnet restore backend/Faturamento.API.Tests/Faturamento.API.Tests.csproj

    - name: Build Microservices
      run: |
        dotnet build backend/Estoque.API/Estoque.API.csproj --no-restore --configuration Release
        dotnet build backend/Faturamento.API/Faturamento.API.csproj --no-restore --configuration Release

    - name: Run Estoque.API Tests
      run: dotnet test backend/Estoque.API.Tests/Estoque.API.Tests.csproj --configuration Release --verbosity normal

    - name: Run Faturamento.API Tests
      run: dotnet test backend/Faturamento.API.Tests/Faturamento.API.Tests.csproj --configuration Release --verbosity normal
