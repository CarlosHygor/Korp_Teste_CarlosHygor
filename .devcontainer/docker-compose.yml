version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    ports:
      - "5000:5000"
      - "5200:5200"
      - "4200:4200"
    command: sleep infinity
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=notafiscal_db;Username=postgres;Password=postgres
    networks:
      - devnet

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notafiscal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devnet

networks:
  devnet:

volumes:
  postgres-data:
